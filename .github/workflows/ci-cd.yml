name: CI/CD - Build & Package Cross-Platform Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. VERIFY & TEST SUITE
  # ---------------------------------------------------------------------------
  verify:
    name: Run Verification & Integrity Suite
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Fdb.csproj

      - name: Build Project
        run: dotnet build Fdb.csproj --configuration Release --no-restore

      - name: Execute Verification Suite (--verify)
        run: dotnet run --configuration Release --no-build -- --verify

  # ---------------------------------------------------------------------------
  # 2. WINDOWS BUILD & INSTALLER PACKAGING
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Installer & Portable Package
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows Standalone Executable (win-x64)
        run: >
          dotnet publish Fdb.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o ./publish/win-x64

      - name: Prepare Windows Distribution Directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ./dist/windows

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup Installer (.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /Q "packaging\windows\installer.iss"

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/win-x64/* -DestinationPath ./dist/windows/Fdb-Studio-1.0.0-win-x64-portable.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/windows/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. LINUX BUILD & DEBIAN/UBUNTU INSTALLER PACKAGING
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux (.deb Installer & Portable .tar.gz)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux Standalone Executable (linux-x64)
        run: >
          dotnet publish Fdb.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o ./publish/linux-x64

      - name: Package Debian Installer (.deb)
        run: |
          chmod +x packaging/linux/build-deb.sh
          ./packaging/linux/build-deb.sh 1.0.0 ./publish/linux-x64 ./dist/linux

      - name: Create Portable .tar.gz Package
        run: |
          mkdir -p dist/linux
          tar -czvf dist/linux/Fdb-Studio-1.0.0-linux-x64-portable.tar.gz -C publish/linux-x64 .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/linux/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. MACOS BUILD & INSTALLER (.dmg & .zip) PACKAGING
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (${{ matrix.rid }})
    needs: verify
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish macOS App Binaries (${{ matrix.rid }})
        run: >
          dotnet publish Fdb.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o ./publish/${{ matrix.rid }}

      - name: Package macOS .app Bundle and .dmg Installer
        run: |
          chmod +x packaging/macos/build-app.sh
          ./packaging/macos/build-app.sh ${{ matrix.rid }} 1.0.0 ./publish/${{ matrix.rid }} ./dist/macos

      - name: Upload macOS Artifacts (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}-packages
          path: dist/macos/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. AUTOMATED GITHUB RELEASE (TRIGGERS ON MAIN BRANCH & TAGS)
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release Packages
    needs: [build-windows, build-linux, build-macos]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release Staging Directory
        run: mkdir -p ./release-assets

      - name: Download Windows Packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: ./release-assets

      - name: Download Linux Packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: ./release-assets

      - name: Download macOS x64 Packages
        uses: actions/download-artifact@v4
        with:
          name: macos-osx-x64-packages
          path: ./release-assets

      - name: Download macOS ARM64 Packages
        uses: actions/download-artifact@v4
        with:
          name: macos-osx-arm64-packages
          path: ./release-assets

      - name: Display Release Assets
        run: ls -lh ./release-assets

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "title=Fdb Studio $TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=Fdb Studio Continuous Build" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          files: ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
